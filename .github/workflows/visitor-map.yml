name: Update visitor map

on:
  schedule:
    - cron: '43 14 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: visitor-map
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && vars.GA4_PROPERTY_ID != '' && vars.GA4_WIF_PROVIDER != '' && vars.GA4_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test public map aggregation
        run: python -m unittest discover -s scripts -p 'test_visitor_countries.py'
      - name: Obtain read-only Analytics token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GA4_WIF_PROVIDER }}
          service_account: ${{ vars.GA4_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - name: Generate public country ranges
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/update_visitor_countries.py
      - name: Save verified map
        run: |
          git add -- docs/assets/visitor-countries.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public visitor map'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Publish and verify the map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          public_matches() {
            local url="https://eetongsu.github.io/assets/visitor-countries.json?check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$1"
            curl -fsS --max-time 10 "$url" -o "$RUNNER_TEMP/visitor-map-live.json" &&
              cmp -s docs/assets/visitor-countries.json "$RUNNER_TEMP/visitor-map-live.json"
          }
          if public_matches initial; then exit 0; fi
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          for attempt in {1..12}; do
            sleep 12
            if public_matches "$attempt"; then exit 0; fi
          done
          echo '::error::Could not verify the new public map. A later run can retry publication.'
          exit 1
